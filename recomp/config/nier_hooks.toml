
# Mid-function hooks (appended last by tools/make_config.ps1). Each calls a runtime function
# with the listed guest registers by reference; see NOTES.md.

# PC Settings page (runtime: pcsettings.cpp). The options / pause menu builder (sub_8241A188), after
# its record loop and before the layout calls: "Select Device" is relabelled "PC Settings".
[[midasm_hook]]
name = "PcSettingsPageBuilt"
address = 0x8241B7DC
registers = ["r31"]

# Text lookup (sub_823CB8C8: r3 table, r4 id; returns the string): our text ids.
[[midasm_hook]]
name = "PcSettingsText"
address = 0x823CB8C8
registers = ["r3", "r4"]
return_on_true = true

# A record's value text (sub_82416C20: r3 record; returns the string): our choices.
[[midasm_hook]]
name = "PcSettingsValueText"
address = 0x82416C20
registers = ["r3"]
return_on_true = true

# The menu input handler (sub_8241C020), action item 27 ("Select Device", now "PC Settings"):
# open the PC page and skip the device selector call (on to the case's common tail).
[[midasm_hook]]
name = "PcSettingsOpen"
address = 0x8241C828
registers = ["r31"]
jump_address_on_true = 0x8241C860

# Return / B (sub_8241BB60: r3 the menu): on the PC page, go back to Game Settings.
[[midasm_hook]]
name = "PcSettingsReturn"
address = 0x8241BB60
registers = ["r3"]
return_on_true = true

# Save list (load / save screens; sub_82427978 refreshes it): the fourth cursor stop is the
# "Select Device" row. Its enable byte (+8367) is set right before 0x824279B4; clearing it makes
# the cursor skip the row (sub_824274E8 skips disabled stops).
[[midasm_hook]]
name = "DisableSelectDeviceRow"
address = 0x824279B4
registers = ["r30"]

# ...and its label: 0x82427B20 chooses the row's text (r27 is the text element); jumping to the
# branch that sets a string pointer (r31, r11 = the element's vtable) with an empty string blanks it.
[[midasm_hook]]
name = "BlankSelectDeviceRow"
address = 0x82427B20
registers = ["r11", "r27", "r31"]
jump_address_on_true = 0x82427B7C

# The save list's input (0x82427E7C on: confirm is tested first, and with the cursor, +8360, on
# row 3 it sets the result +8356 = 1 at 0x82427ED0, which opens the device selector). With the
# cursor on that row, Left or Right counts as confirming too, and says which way the page of saves
# turns (SavePageTurn, xam.cpp).
[[midasm_hook]]
name = "SavePageTurn"
address = 0x82427E84
registers = ["r30"]
jump_address_on_true = 0x82427ED0

# The menu input handler (sub_8241C020), an action row was chosen: r4 holds its item id (22-36 are
# the game's). Ours (Key Bindings pages, Restore Default Keys) are handled, then on to the common tail.
[[midasm_hook]]
name = "PcSettingsAction"
address = 0x8241C778
registers = ["r4", "r31"]
jump_address_on_true = 0x8241C860

# The same handler's entry, every frame a settings page is open (r3 the menu): key capture.
[[midasm_hook]]
name = "PcSettingsTick"
address = 0x8241C020
registers = ["r3"]

# The DLC notice on Continue (sub_8219B0D0: "The quest "Recycled World" is now available." and where
# to find it, messages 2481 / 2482, shown while the flag at r30 is set): clear the flag and go on
# as after the notice (runtime: xam.cpp).
[[midasm_hook]]
name = "SkipDlcNotice"
address = 0x8219B300
registers = ["r30"]
jump_address_on_true = 0x8219B368

# Quit to Desktop in place of the title menu's "Downloadable Content" (it only opened the store).
# The game offers the entry while NO DLC is installed and greys it out otherwise: the flag at
# +3043 of the title object is set through sub_82197498 (r4: the flag, "DLC count == 0") and
# cleared at 0x8219B0BC when the count (tested at 0x8219B0B4) is above zero. Here it is always
# set. Confirming the entry (sub_82199788, cursor +3020 == 3, at 0x82199B20) quits the game
# instead of opening the store (runtime: pcsettings.cpp; the label images: glyphs.cpp).
[[midasm_hook]]
name = "TitleEnableQuit"
address = 0x82197498
registers = ["r4"]

[[midasm_hook]]
name = "TitleKeepQuitEnabled"
address = 0x8219B0B4
registers = ["r11"]

# The flag starts cleared when the title object is set up (stb r30,3043(r31) at 0x8219ACF8) and the
# setter above only runs when the game re-checks its DLC (coming back from New Game, for one): at
# boot the entry could stay off. It is switched on right after that initialisation as well.
[[midasm_hook]]
name = "TitleInitQuit"
address = 0x8219ACFC
registers = ["r31"]

[[midasm_hook]]
name = "TitleQuitToDesktop"
address = 0x82199B20
registers = ["r31"]

# High frame rates: the trail of the player's positions a partner (Kaine, Emil) follows gets a
# point when the frame counter is a multiple of 8 (lwz r11,16(r10) / clrlwi r9,r11,29 in
# sub_821F02C0): every 0.267 s at 30 fps, eight times as often at 240, where the 64-point trail
# became too short and the partner kept being warped to the player. The hook replaces the counter
# with one that passes the test every 8/30 s of game time (runtime: highfps.cpp).
[[midasm_hook]]
name = "PartnerTrailCadence"
address = 0x821F06FC
registers = ["r11", "r31"]

# High frame rates: Kaine's "am I stuck" test (sub_82213DC0) samples her position every 4 frames
# (lwz r11,16(r27) / clrlwi r11,r11,30) into a ring and warps her to the player when the ring's
# ends are too close. At 240 fps the ring spanned under a second and she was warped constantly.
# The hook makes the sampling go by game time: every 4/30 s (runtime: highfps.cpp).
[[midasm_hook]]
name = "PartnerStuckCadence"
address = 0x82214118
registers = ["r11", "r31"]

# High frame rates: the fishing camera (sub_821A5830) adds the right stick to the camera's angles
# as degrees a frame, with no time step, so at 240 fps it turned eight times as fast as on the
# console. The hook scales the two stick terms (f29 across, f30 up and down) by the frame's
# share of a 30 fps frame (runtime: highfps.cpp).
[[midasm_hook]]
name = "FishingCameraTurn"
address = 0x821A5B68
registers = ["f29", "f30"]

# Recorded input (test runs): the main loop (sub_82496D00) is about to simulate the time step in
# f31. The hook counts the loop's turns and, with a recording, writes each step or hands the game
# the recorded one, so a replay simulates what was recorded tick for tick (runtime: gametick.cpp).
[[midasm_hook]]
name = "GameStepHook"
address = 0x82496E60
registers = ["f31"]
